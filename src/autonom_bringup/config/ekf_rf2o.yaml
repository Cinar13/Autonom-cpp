# Overlay for ekf.yaml, loaded only when use_rf2o:=true: rf2o laser odometry, forward velocity and yaw rate.
# Yaw rate fused again 2026-11-27 (user decision): on a teleop loop on the real robot rf2o turned -353 deg for a
# -360 deg lap (0.09 m / 5 deg closing error), the wheels -293 deg (1.48 m / 67 deg), and the EKF followed the wheels.
ekf_filter_node:
  ros__parameters:
    odom1: /rf2o/odom
    odom1_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom1_queue_size: 10
    odom1_differential: false
    odom1_relative: false

    # Mahalanobis gating rejects rf2o jumps in feature-poor scenes.
    odom1_twist_rejection_threshold: 3.0
