# Overlay for ekf.yaml, loaded only when use_rf2o:=true: rf2o laser odometry twist.
ekf_filter_node:
  ros__parameters:
    odom1: /rf2o/odom
    odom1_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom1_queue_size: 10
    odom1_differential: false
    odom1_relative: false

    # Mahalanobis gating rejects rf2o jumps in feature-poor scenes.
    odom1_twist_rejection_threshold: 3.0
