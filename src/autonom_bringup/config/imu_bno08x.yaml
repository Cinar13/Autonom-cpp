# Default IMU: CEVA BNO08x (BNO085/BNO086) over I2C, driven by bno08x_ros2_driver (unmodified submodule).
# Found on the robot at 0x4B on I2C bus 1 (header pins 3/5), 2026-11-26; the sensor's SA0 pin is high.
# The driver publishes /imu with all covariances at zero; hardware.launch.py remaps it to /imu/raw and
# autonom_localization's imu_covariance_relay republishes it on /imu/data with the variances below.
# Orientation is the magnetometer-based rotation vector: the EKF uses it only to remove gravity (roll/pitch),
# never fuses it (see ekf_imu.yaml).
/**:
  ros__parameters:
    # bno08x_ros2_driver
    frame_id: "imu_link"
    i2c:
      enabled: true
      bus: "/dev/i2c-1"
      address: "0x4B"
    uart:
      enabled: false
    spi:
      enabled: false
    publish:
      magnetic_field:
        enabled: false
        # The driver polls at the faster of the two rates, even when a report is disabled: keep this equal to imu.
        rate: 100
      imu:
        enabled: true
        rate: 100

    # imu_covariance_relay (autonom_localization): same noise figures as the BNO055 config and the simulated IMU
    variance_orientation: [0.0159, 0.0159, 0.0159]
    variance_angular_vel: [0.0004, 0.0004, 0.0004]
    variance_acc: [0.017, 0.017, 0.017]
