# Nav2 for mapping-while-navigating: slam_toolbox provides /map and map->odom (no AMCL / map_server).
# Regulated Pure Pursuit by default, to keep the Raspberry Pi 5 CPU budget for SLAM. bringup.launch.py
# controller:=mppi keeps RPP for the mapping lap and races with MPPI (config/nav2_mppi.yaml; CPU on the Pi untested).
# Tuned for the real robot (19 x 17.5 cm rectangular footprint, 0.6 m/s on straights) on the Fibonacci race arena: 2.49 x 2.10 m, ~0.6 m
# corridors, three hairpins (robot_sim/models/Fibonacci_arena). robot_sim overlays adapt it to the TurtleBot3.
# Competition tuning (docs/06_competition_rules.md): hard margin footprint + 20 mm (user decision, 2026-11-07)
# plus a soft, steep cost out to `inflation_radius` (cost_scaling_factor 10, ~1/3 cost 0.1 m off the wall): the
# fastest path keeps ~0.1 m off inside corners, so RPP's lookahead collision check no longer stalls the robot
# there, yet it can still squeeze to 20 mm to pass another robot.
# RPP slows down near walls and other robots, and a stuck robot is detected within 2 s so the race behavior tree
# (behavior_trees/navigate_to_pose_race.xml) backs it off before the 3 s wall-contact limit.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /odometry/filtered
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      # Counts rotation as progress too, so rotate-to-heading is not mistaken for being stuck.
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.10
      required_movement_angle: 0.35
      movement_time_allowance: 2.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.5
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.6
      # Lookahead grows with speed (0.6 s) but stays short for 0.6 m corridors and hairpins.
      lookahead_dist: 0.4
      # Must stay above general_goal_checker.xy_goal_tolerance (0.2): RPP compares the *carrot* distance with
      # that tolerance, and a slow robot clamps the carrot to min_lookahead_dist. When they were equal the carrot
      # sat at 0.2499..., latched "rotate to goal heading" (vx = 0) far from the goal, and the robot stalled.
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.6
      lookahead_time: 0.6
      rotate_to_heading_angular_vel: 2.0
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      # Short horizon: pure pursuit cuts the hairpins, and a 1 s horizon stalled the robot there.
      max_allowed_time_to_collision_up_to_carrot: 0.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.2
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 10.0  # must match the costmaps' cost_scaling_factor
      # Brake for the hairpins (radius ~0.3 m), full speed on the straights.
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.15
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 4.0
      max_robot_pose_search_dist: 10.0
      allow_reversing: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.05
      # Real robot (measured 2026-11-26): 19 cm long, 17.5 cm wide, wheel axle (base_footprint) 6.5 cm from the
      # back: x -0.065..+0.125, y -0.0875..+0.0875. A circle around it needs r = 0.153 and wasted the corridor
      # width in corners (stuck at the 4th hairpin). Padding 0.02 keeps the hard margin (+20 mm, docs/06).
      footprint: "[[0.125, 0.0875], [0.125, -0.0875], [-0.065, -0.0875], [-0.065, 0.0875]]"
      footprint_padding: 0.02
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          # Speckle-filtered: one noisy beam must not become a lethal obstacle (slam_toolbox keeps /scan).
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          # Returns inside the robot (its own cables, mounts: 5-11 cm on the real robot) are not obstacles.
          raytrace_min_range: 0.16
          obstacle_max_range: 3.5
          obstacle_min_range: 0.16
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.25
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      # Real robot (measured 2026-11-26): 19 cm long, 17.5 cm wide, wheel axle (base_footprint) 6.5 cm from the
      # back: x -0.065..+0.125, y -0.0875..+0.0875. A circle around it needs r = 0.153 and wasted the corridor
      # width in corners (stuck at the 4th hairpin). Padding 0.02 keeps the hard margin (+20 mm, docs/06).
      footprint: "[[0.125, 0.0875], [0.125, -0.0875], [-0.065, -0.0875], [-0.065, 0.0875]]"
      footprint_padding: 0.02
      resolution: 0.05
      track_unknown_space: true
      # Live LiDAR only, no static layer from the SLAM map: obstacles that leave (other robots, a removed box)
      # are cleared by raytracing as soon as the LiDAR sees through them, while walls stay marked because
      # nothing ever sees through a wall. The SLAM map kept such obstacles for minutes.
      # Fixed window around the start pose (map origin); the track must fit inside it (arena: 2.5 x 2.1 m).
      rolling_window: false
      width: 8
      height: 8
      origin_x: -4.0
      origin_y: -4.0
      plugins: ["obstacle_layer", "inflation_layer"]
      # Rear gate from loop_patrol (/rear_gate_mask): lethal wall behind the robot, so no plan turns back.
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: /costmap_filter_info
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          # Speckle-filtered: one noisy beam must not become a lethal obstacle (slam_toolbox keeps /scan).
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          # Longer than the local costmap: walls and robots further down the track enter the plan early, and
          # rays clear a departed robot from further away.
          raytrace_max_range: 9.0
          # Returns inside the robot (its own cables, mounts: 5-11 cm on the real robot) are not obstacles.
          raytrace_min_range: 0.16
          obstacle_max_range: 8.0
          obstacle_min_range: 0.16
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.25
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: true
      # The map is still growing; let plans cross unknown space at the frontier.
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    # Waypoints sampled from a growing map can become unreachable; skip them instead of aborting the lap.
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.6, 0.0, 3.0]
    min_velocity: [-0.15, 0.0, -3.0]
    max_accel: [1.5, 0.0, 5.0]
    max_decel: [-2.0, 0.0, -5.0]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

costmap_filter_info_server:
  ros__parameters:
    type: 0  # keepout
    filter_info_topic: /costmap_filter_info
    mask_topic: /rear_gate_mask
    base: 0.0
    multiplier: 1.0

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    bond_timeout: 4.0
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - velocity_smoother
      - bt_navigator
      - waypoint_follower
      - costmap_filter_info_server
