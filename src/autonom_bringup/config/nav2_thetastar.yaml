# Nav2 overlay for planner:=thetastar (bringup.launch.py on the robot, fibonacci_simulation.launch.py in the sim):
# Theta* instead of NavFn for the global path.
# Theta* is A* with line-of-sight shortcuts, so the path is a few straight segments between corners instead of
# NavFn's grid staircase; w_traversal_cost keeps those segments off the walls.
planner_server:
  ros__parameters:
    GridBased:
      plugin: "nav2_theta_star_planner::ThetaStarPlanner"
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 5.0
      use_final_approach_orientation: false
      allow_unknown: true
