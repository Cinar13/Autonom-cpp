# Covariances attached to odometry sources that publish none (rf2o, Gazebo DiffDrive).
# Diagonal order: [x, y, z, roll, pitch, yaw]; 1e+6 marks dimensions the EKF must ignore.
rf2o_covariance_relay:
  ros__parameters:
    pose_covariance_diagonal: [1.0e-2, 1.0e-2, 1.0e+6, 1.0e+6, 1.0e+6, 2.0e-2]
    twist_covariance_diagonal: [5.0e-3, 5.0e-3, 1.0e+6, 1.0e+6, 1.0e+6, 1.0e-2]

wheel_odom_covariance_relay:
  ros__parameters:
    pose_covariance_diagonal: [1.0e-3, 1.0e-3, 1.0e+6, 1.0e+6, 1.0e+6, 1.0e-2]
    twist_covariance_diagonal: [2.0e-3, 1.0e-4, 1.0e+6, 1.0e+6, 1.0e+6, 2.0e-2]
