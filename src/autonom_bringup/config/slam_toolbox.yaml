# slam_toolbox async online mapping, tuned for an RPLiDAR S3 on a Raspberry Pi 5.
slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 2.0
    resolution: 0.05
    restamp_tf: false
    min_laser_range: 0.16  # hits on the robot's own body and cables (all within ~0.17 m of the LiDAR) stay out of the map
    # S3 reaches 40 m; capping keeps scan matching and rastering affordable on the Pi.
    max_laser_range: 15.0
    minimum_time_interval: 0.3
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    # Heading penalty: response *= max(1 - 0.2 * dyaw^2 / angle_variance_penalty, minimum_angle_penalty), dyaw =
    # matched yaw - odometry (gyro + wheels) yaw. At the default 1.0 / 0.9 a 0.05 rad deviation cost 0.05 %, so in
    # the arena's round hairpins (scans look alike when rotated about the curve) the matcher slid in yaw: the first
    # hairpin was mapped rotated by ~0.2 rad with odometry within 0.01 rad of ground truth, and the frozen map kept
    # the bend (SLAM yaw error up to 0.47 rad every lap). 0.001 / 0.5: 0.05 rad costs 50 %. Measured (150 s, ground
    # truth): SLAM yaw error max 0.47 -> 0.12 rad, position max 0.39 -> 0.08 m, collision stalls 148 -> 22.
    angle_variance_penalty: 0.001
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.5
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    # Fraction of scans through a cell that must hit it for the cell to stay occupied (slam_toolbox default).
    # 0.4 was tried so removed obstacles cleared faster, but it erased the race arena's 18 mm inner walls (rays
    # passing beside a thin wall count as misses for its 5 cm cell): only the near-symmetric outer box was left
    # to match against and the SLAM pose rotated up to ~1 rad. Moving robots no longer need fast clearing here:
    # the global costmap is live-only and the patrol reuses its last lap while the map is blocked.
    occupancy_threshold: 0.1
