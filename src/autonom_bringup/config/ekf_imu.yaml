# Overlay for ekf.yaml, loaded only when use_imu:=true.
# Gyro yaw rate is the IMU's most reliable 2D signal; absolute yaw is left out because the
# magnetometer is unreliable near the motors.
ekf_filter_node:
  ros__parameters:
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_angular_velocity_rejection_threshold: 5.0
