# Overlay for ekf.yaml, loaded only when use_imu:=true. Only the gyro is used; the accelerometer is not fused.
# Fused: gyro yaw rate only. Forward speed comes from the wheels and rf2o. Forward acceleration ax is left out: on the
# real BNO08x its bias, mounting tilt, wall-contact spikes and dropouts were integrated into speed, and the EKF pose ran
# ~5 m away while the robot stood still (2026-11-27), so every Nav2 goal "succeeded" without moving. Absolute yaw is
# left out because the magnetometer is unreliable near the motors.
ekf_filter_node:
  ros__parameters:
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false
    imu0_angular_velocity_rejection_threshold: 5.0
