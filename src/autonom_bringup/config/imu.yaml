# Default IMU: Bosch BNO055 over I2C (ros-jazzy-bno055). The driver publishes "<prefix>imu",
# which the launch file remaps to /imu/data. Swap via the imu_package / imu_executable /
# imu_params_file launch arguments for a different sensor.
/**:
  ros__parameters:
    ros_topic_prefix: ""
    connection_type: "i2c"
    i2c_bus: 1
    i2c_addr: 0x28
    data_query_frequency: 50
    calib_status_frequency: 0.1
    frame_id: "imu_link"
    operation_mode: 0x0C
    placement_axis_remap: "P1"
    acc_factor: 100.0
    mag_factor: 16000000.0
    gyr_factor: 900.0
    grav_factor: 100.0
    set_offsets: false
    variance_acc: [0.017, 0.017, 0.017]
    variance_angular_vel: [0.0004, 0.0004, 0.0004]
    variance_orientation: [0.0159, 0.0159, 0.0159]
    variance_mag: [0.0, 0.0, 0.0]
