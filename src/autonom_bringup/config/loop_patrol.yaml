loop_patrol:
  ros__parameters:
    map_topic: /map
    global_frame: map
    robot_base_frame: base_footprint
    waypoint_count: 8
    clearance: 0.35
    max_radius: 0.0
    min_spacing: 0.5
    free_threshold: 25
    min_known_area: 4.0
    lap_pause: 2.0
    retry_period: 3.0
    # Lap direction (AC-5.1). auto: the direction the robot faces at the start; it never crosses the start
    # line backwards (team rule, docs/06 section 4). clockwise | counterclockwise force a direction and
    # are refused when they run against the start heading.
    direction: auto
    start_line_half_width: 1.0
    # Exploration goals stay within this distance so Nav2 never takes the shorter way back round the track.
    max_exploration_distance: 2.5
    wait_for_race_start: true
    race_state_topic: /race/state
