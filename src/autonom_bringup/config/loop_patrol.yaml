loop_patrol:
  ros__parameters:
    map_topic: /map
    global_frame: map
    robot_base_frame: base_footprint
    # Race arena, ~0.6 m corridors: waypoints 0.13 m off the walls (robot r = 0.15 m).
    clearance: 0.13
    min_spacing: 0.3
    # Lap waypoints every waypoint_spacing metres of driving distance along the track centre line; a closed
    # ring shorter than min_loop_length is not a lap. The lap is cut at the rear gate (rear_gate_offset),
    # across at most cut_half_width.
    waypoint_spacing: 0.4
    # The arena lap is ~7 m; anything much shorter is a detour, not a lap.
    min_loop_length: 5.0
    cut_half_width: 0.6
    free_threshold: 25
    min_known_area: 2.0
    lap_pause: 0.0
    # Send the next lap when this many lap poses remain (continuous driving, no stop at the lap end).
    preempt_poses_remaining: 1
    # Map slowly, race fast (m/s): the mapping lap at full speed overshot hairpins into corner pockets.
    exploration_speed: 0.45
    race_speed: 0.6
    # Acceleration limits (velocity_smoother max_accel [x m/s^2, y, theta rad/s^2]): gentle while mapping, then
    # back to nav2.yaml's velocity_smoother values for the race.
    exploration_max_accel: [0.8, 0.0, 3.0]
    race_max_accel: [1.5, 0.0, 5.0]
    # Fast mode (race_speed, race_max_accel) starts this long (s) after the map is finished (the map freeze).
    race_speed_delay: 10.0
    # Fast mode cruise-speed caps per lap section (0 = off; only caps below race_speed matter). Off by default:
    # Nav2's own curvature braking with the high-speed tuning (robot_sim nav2_fibonacci_fast.yaml) did better at
    # 1.4 m/s (6 laps, 0 failed, wall within 0.15 m 2.7 % of the time) than these caps (5 laps, 2 failed, 5.3 %).
    # The lap is split
    # into straights where it turns by more than corner_angle (rad) at a waypoint.
    # - straights shorter than short_straight_length (m, corner to corner): short_straight_speed (m/s), no room to
    #   reach race_speed and brake again for the next corner;
    # - the last corner_approach_distance (m) before every corner: corner_approach_speed (m/s), braking before the
    #   turn instead of overshooting it. A cap only slows a robot that is faster than it, so at 1.0 the robot
    #   brakes for corners only when it is going over 1 m/s (1.2 brakes less).
    corner_angle: 0.35
    short_straight_length: 0.0
    short_straight_speed: 1.0
    corner_approach_distance: 0.0
    corner_approach_speed: 1.0
    retry_period: 3.0
    # Lap direction (AC-5.1). Laps always follow the direction the robot faces at the start (it never turns
    # back, docs/06 section 4). clockwise | counterclockwise only add a check: a lap in the other orientation is
    # refused (robot placed the wrong way round).
    direction: auto
    start_line_half_width: 0.4
    # Exploration goals stay within this distance so Nav2 never takes the shorter way back round the track.
    max_exploration_distance: 0.6
    # Keepout wall across the track this far behind the robot (global costmap KeepoutFilter): Nav2 can never
    # plan a path that turns back. Moves forward every rear_gate_update_distance of forward travel.
    rear_gate_enabled: true
    rear_gate_offset: 0.25
    rear_gate_update_distance: 0.2
    rear_gate_mask_topic: /rear_gate_mask
    behind_drop_radius: 0.5
    # Phase 2 (launch argument localize_after_mapping): freeze the map at the first forward start-line crossing
    # after the lap is found; slam_toolbox then only scan-matches against it (docs/06: it still mapped the loop).
    localize_after_laps: 1
    localization_mode_service: /slam_toolbox/set_localization_mode
    wait_for_race_start: true
    race_state_topic: /race/state
