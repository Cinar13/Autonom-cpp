# Overlay on autonom_bringup/config/nav2.yaml and loop_patrol.yaml (the real robot on the Fibonacci race arena at
# 0.6 m/s) for urdf/turtlebot3_burger_fast.urdf.xacro: the TurtleBot3 body (r = 0.105 m) at the real robot's speed,
# Lower soft margins (0.14 m inflation, 0.10 m clearance, 0.3 s collision horizon) were tried: the plan hugged the
# walls, RPP's collision check stalled the robot (177 warnings) and three laps in a row failed. Kept at these.
local_costmap:
  local_costmap:
    ros__parameters:
      robot_radius: 0.11
      inflation_layer:
        inflation_radius: 0.18

global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.11
      inflation_layer:
        inflation_radius: 0.18

loop_patrol:
  ros__parameters:
    clearance: 0.12
    rear_gate_offset: 0.2

# High-speed tuning (race speeds above 1 m/s). Nav2 slows for corners on its own: curvature braking from a 0.9 m
# radius, and it keeps rolling through the hairpins instead of stopping to turn on the spot (only when the path is
# nearly behind the robot, > 1.4 rad). A 0.3 s collision horizon stops the check from reaching the 0.6 m corridor
# walls at speed. Measured at 1.25 m/s (95 s after fast mode, GUI, loop_patrol's section caps off): 7 laps (11.3-16.0 s),
# 0 failed, 0 reverse, 18 collision stalls, turning on the spot 1.4 % of the time (was 20 %), stopped 3 % (was 21 %).
controller_server:
  ros__parameters:
    FollowPath:
      max_allowed_time_to_collision_up_to_carrot: 0.3
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.3
      lookahead_time: 0.5
      max_lookahead_dist: 0.7
      rotate_to_heading_min_angle: 1.4

velocity_smoother:
  ros__parameters:
    max_decel: [-3.0, 0.0, -6.0]
