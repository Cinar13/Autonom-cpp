# Overlay for fibonacci_simulation.launch.py controller:=graceful: Nav2's Graceful controller instead of Regulated
# Pure Pursuit. It steers along a smooth pose-following control law towards a target on the path and slows with the
# curvature of that law (v = v_max / (1 + beta * |k|^lambda)), so it rounds corners instead of cutting them.
# loop_patrol sets the cruise speed live through FollowPath.v_linear_max (speed_parameter).
controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_graceful_controller::GracefulController"
      transform_tolerance: 0.2
      min_lookahead: 0.3
      max_lookahead: 0.7
      max_robot_pose_search_dist: 10.0
      k_phi: 2.0
      k_delta: 1.0
      beta: 0.4
      lambda: 2.0
      v_linear_min: 0.1
      v_linear_max: 0.6
      v_angular_max: 3.0
      v_angular_min_in_place: 0.5
      slowdown_radius: 0.4
      initial_rotation: true
      initial_rotation_tolerance: 1.4
      prefer_final_rotation: false
      rotation_scaling_factor: 0.5
      allow_backward: false
      use_collision_detection: true
      in_place_collision_resolution: 0.1

loop_patrol:
  ros__parameters:
    speed_parameter: FollowPath.v_linear_max
