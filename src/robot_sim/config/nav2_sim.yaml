# Overlay on autonom_bringup/config/nav2.yaml and loop_patrol.yaml (tuned for the real robot on the Fibonacci race
# arena) for the TurtleBot3 Burger (r = 0.105 m, v_max = 0.22 m/s) on the large circuit2 test track
# (~9 x 9 m, 1.5-2 m corridors). The simulated LiDAR already matches the RPLiDAR S3.
controller_server:
  ros__parameters:
    general_goal_checker:
      xy_goal_tolerance: 0.25
    FollowPath:
      desired_linear_vel: 0.22
      lookahead_dist: 0.5
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.0
      max_allowed_time_to_collision_up_to_carrot: 1.0
      cost_scaling_dist: 0.35
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.1

local_costmap:
  local_costmap:
    ros__parameters:
      width: 3
      height: 3
      robot_radius: 0.11
      inflation_layer:
        inflation_radius: 0.35

global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.11
      width: 30
      height: 30
      origin_x: -15.0
      origin_y: -15.0
      inflation_layer:
        inflation_radius: 0.35

velocity_smoother:
  ros__parameters:
    max_velocity: [0.22, 0.0, 2.0]
    min_velocity: [-0.15, 0.0, -2.0]
    max_accel: [1.0, 0.0, 3.0]
    max_decel: [-1.5, 0.0, -3.5]

loop_patrol:
  ros__parameters:
    exploration_speed: 0.22
    race_speed: 0.22
    race_max_accel: [1.0, 0.0, 3.0]  # this file's velocity_smoother.max_accel
    # circuit2 corridors are ~1.43 m clear: waypoints 0.5 m off the walls sit near the centre line.
    clearance: 0.5
    min_spacing: 0.4
    waypoint_spacing: 1.0
    min_loop_length: 2.0
    cut_half_width: 1.5
    min_known_area: 4.0
    start_line_half_width: 1.0
    max_exploration_distance: 2.5
    rear_gate_offset: 0.4
    behind_drop_radius: 2.0
