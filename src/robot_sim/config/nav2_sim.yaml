# Overlay on autonom_bringup/config/nav2.yaml for the TurtleBot3 Burger body (r = 0.105 m, v_max = 0.22 m/s).
# The simulated LiDAR already matches the RPLiDAR S3, so only footprint and speed limits differ.
controller_server:
  ros__parameters:
    FollowPath:
      desired_linear_vel: 0.2
      rotate_to_heading_angular_vel: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      robot_radius: 0.11
      inflation_layer:
        inflation_radius: 0.13

global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.11
      inflation_layer:
        inflation_radius: 0.13

velocity_smoother:
  ros__parameters:
    max_velocity: [0.22, 0.0, 2.0]
    min_velocity: [-0.15, 0.0, -2.0]

loop_patrol:
  ros__parameters:
    # circuit2 corridors are ~1.43 m clear: waypoints 0.5 m off the walls sit near the centre line.
    clearance: 0.5
    min_spacing: 0.4
