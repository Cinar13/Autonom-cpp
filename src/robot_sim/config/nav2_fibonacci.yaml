# Overlay on autonom_bringup/config/nav2.yaml and loop_patrol.yaml for the Fibonacci race arena
# (models/Fibonacci_arena: 2.49 x 2.10 m, ~0.6 m corridors, a hairpin under the divider) and the
# TurtleBot3 Burger (r = 0.105 m, v_max = 0.22 m/s).
controller_server:
  ros__parameters:
    general_goal_checker:
      xy_goal_tolerance: 0.15
    FollowPath:
      desired_linear_vel: 0.22
      rotate_to_heading_angular_vel: 1.5
      # Short lookahead for 0.6 m corridors and the hairpin; must stay above xy_goal_tolerance.
      lookahead_dist: 0.35
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.45
      # Only check collisions this far ahead: pure pursuit cuts the hairpin under the divider, and a 1 s horizon
      # stalled the robot there.
      max_allowed_time_to_collision_up_to_carrot: 0.5
      regulated_linear_scaling_min_radius: 0.3
      cost_scaling_dist: 0.2

local_costmap:
  local_costmap:
    ros__parameters:
      width: 2
      height: 2
      robot_radius: 0.11
      inflation_layer:
        inflation_radius: 0.18

global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.11
      # Arena fits in +-2.5 m around any start pose inside it.
      width: 6
      height: 6
      origin_x: -3.0
      origin_y: -3.0
      inflation_layer:
        inflation_radius: 0.18

velocity_smoother:
  ros__parameters:
    max_velocity: [0.22, 0.0, 2.0]
    min_velocity: [-0.15, 0.0, -2.0]

loop_patrol:
  ros__parameters:
    # Corridors ~0.6 m: waypoints 0.12 m off the walls keep a 0.36 m centre band.
    clearance: 0.12
    min_spacing: 0.3
    waypoint_spacing: 0.4
    # The arena lap is ~7 m; anything much shorter is a detour, not a lap.
    min_loop_length: 5.0
    rear_gate_offset: 0.2
    cut_half_width: 0.6
    behind_drop_radius: 0.5
    max_exploration_distance: 0.6
    start_line_half_width: 0.4
