# Pin numbers are RP1 GPIO line offsets (BCM numbering on the 40-pin header).
# Hardware PWM on RPi 5 needs /boot/firmware/config.txt: dtoverlay=pwm-2chan,pin=12,func=4,pin2=13,func2=4
# (GPIO12 -> PWM0 channel 0, GPIO13 -> PWM0 channel 1). Check `ls /sys/class/pwm` for the chip index.
# Pinout (BCM / header pin), from the wiring schematic (TB6612FNG motor driver, VM from the 6 V buck, VCC 3.3 V):
#   left  motor (TB6612 channel A): PWMA GPIO12 / 32, AIN1 GPIO5 / 29, AIN2 GPIO6 / 31;  encoder A GPIO17 / 11, B GPIO27 / 13
#   right motor (TB6612 channel B): PWMB GPIO13 / 33, BIN1 GPIO20 / 38, BIN2 GPIO21 / 40; encoder A GPIO23 / 16, B GPIO24 / 18
#   TB6612 STBY GPIO26 / 37 (shared, high = enabled)
#   BNO055 IMU on I2C1 (SDA GPIO2 / 3, SCL GPIO3 / 5), address 0x28; RPLiDAR S3 on USB (/dev/ttyUSB0).

/**:
  ros__parameters:
    gpio_chip: "pinctrl-rp1"
    wheel_radius: 0.0325
    wheel_separation: 0.17
    left_joint_name: "left_wheel_joint"
    right_joint_name: "right_wheel_joint"

motor_driver:
  ros__parameters:
    control_frequency_hz: 50.0
    max_wheel_speed: 20.0
    stop_velocity_threshold: 0.05
    cmd_vel_timeout: 0.5
    feedback_timeout: 0.25
    standby_pin: 26
    left_motor:
      pwm_chip: "/sys/class/pwm/pwmchip0"
      pwm_channel: 0
      in1_pin: 5
      in2_pin: 6
      pwm_frequency_hz: 20000.0
      inverted: false
    right_motor:
      pwm_chip: "/sys/class/pwm/pwmchip0"
      pwm_channel: 1
      in1_pin: 20
      in2_pin: 21
      pwm_frequency_hz: 20000.0
      inverted: true
    pid:
      kp: 0.04
      ki: 0.4
      kd: 0.0
      kf: 0.045
      integral_limit: 0.5
      output_limit: 1.0

wheel_odometry:
  ros__parameters:
    ticks_per_revolution: 1320
    publish_frequency_hz: 50.0
    publish_tf: false
    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
    left_encoder:
      pin_a: 17
      pin_b: 27
      inverted: false
      pull_up: true
    right_encoder:
      pin_a: 23
      pin_b: 24
      inverted: true
      pull_up: true
    pose_covariance_diagonal: [1.0e-3, 1.0e-3, 1.0e6, 1.0e6, 1.0e6, 1.0e-2]
    twist_covariance_diagonal: [2.0e-3, 1.0e-4, 1.0e6, 1.0e6, 1.0e6, 2.0e-2]

