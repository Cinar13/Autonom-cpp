# Pin numbers are RP1 GPIO line offsets (BCM numbering on the 40-pin header).
# Hardware PWM on RPi 5 needs /boot/firmware/config.txt: dtoverlay=pwm-2chan,pin=12,func=4,pin2=13,func2=4
# (GPIO12 -> PWM0 channel 0, GPIO13 -> PWM0 channel 1). Check `ls /sys/class/pwm` for the chip index.
# Pinout (BCM / header pin), from the wiring schematic (TB6612FNG motor driver, VM from the 6 V buck, VCC 3.3 V):
#   left  motor (TB6612 channel B): PWMB GPIO13 / 33, BIN1 GPIO20 / 38, BIN2 GPIO21 / 40; encoder A GPIO23 / 16, B GPIO24 / 18
#   right motor (TB6612 channel A): PWMA GPIO12 / 32, AIN1 GPIO5 / 29, AIN2 GPIO6 / 31;  encoder A GPIO17 / 11, B GPIO27 / 13
#   (Both motor channels and both encoder pairs are crossed with respect to the original schematic; this is the real wiring.)
#   TB6612 STBY GPIO26 / 37 (shared, high = enabled)
#   Start button GPIO16 / 36, other side to GND (internal pull-up, pressed = low)
#   BNO08x (BNO085/086) IMU on I2C1 (SDA GPIO2 / 3, SCL GPIO3 / 5), address 0x4B; RPLiDAR S3 on USB (/dev/ttyUSB0).

/**:
  ros__parameters:
    gpio_chip: "pinctrl-rp1"
    # Effective radius from two powered 0.5 m drives (2026-11-27): odometry read 0.54 m at 0.016, measured 0.42 / 0.44 m.
    # Smaller than the 30-33 mm wheels measured by hand (tyre compression / slip). Was 0.0325.
    wheel_radius: 0.0127
    wheel_separation: 0.14  # wheel centre to wheel centre, measured on the robot 2026-11-26 (was 0.17)
    left_joint_name: "left_wheel_joint"
    right_joint_name: "right_wheel_joint"

motor_driver:
  ros__parameters:
    control_frequency_hz: 50.0
    # Motor limit: N20 6 V, 300 rpm at the 1:50 gearbox output = 31.42 rad/s (0.40 m/s on the 0.0127 m effective wheel radius).
    max_wheel_speed: 31.42
    stop_velocity_threshold: 0.05
    cmd_vel_timeout: 0.5
    feedback_timeout: 0.25
    standby_pin: 26
    # Motor channels swapped 2026-11-26 after an open-loop test on the robot: TB6612 channel B (PWM GPIO13, BIN
    # GPIO20/21) drives the left wheel (BIN1 high = forward) and channel A (PWM GPIO12, AIN GPIO5/6) the right wheel.
    left_motor:
      pwm_chip: "/sys/class/pwm/pwmchip0"
      pwm_channel: 1
      in1_pin: 20
      in2_pin: 21
      pwm_frequency_hz: 20000.0
      inverted: false
    right_motor:
      pwm_chip: "/sys/class/pwm/pwmchip0"
      pwm_channel: 0
      in1_pin: 5
      in2_pin: 6
      pwm_frequency_hz: 20000.0
      inverted: false
    pid:
      kp: 0.04
      ki: 0.4
      kd: 0.0
      # Feed-forward ~ 1 / no-load speed at full duty: 1 / 31.42 rad/s (300 rpm). Tune on the robot.
      kf: 0.032
      integral_limit: 0.5
      output_limit: 1.0

wheel_odometry:
  ros__parameters:
    # N20 Hall encoder on the back of each motor: 7 PPR = 28 counts per motor turn after x4 decoding, x 1:50 gearbox
    # (300 rpm at the output) = 1400 counts per wheel revolution. The simulation's sim_wheel_odometry_node uses this value too.
    ticks_per_revolution: 1400
    publish_frequency_hz: 50.0
    publish_tf: false
    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
    # Left/right encoders swapped 2026-11-26 after a hand-turn test on the robot (GPIO23/24 reads the left wheel,
    # GPIO17/27 the right). Each pin pair kept its own sign; the left sign is still unverified.
    left_encoder:
      pin_a: 23
      pin_b: 24
      inverted: true
      pull_up: true
    right_encoder:
      pin_a: 17
      pin_b: 27
      inverted: false
      pull_up: true
    pose_covariance_diagonal: [1.0e-3, 1.0e-3, 1.0e+6, 1.0e+6, 1.0e+6, 1.0e-2]
    # Yaw-rate variance 0.2 (was 0.02): the wheels skid in turns (19 % short on a teleop lap, 2026-11-27), so the
    # EKF takes its turn rate mainly from rf2o (0.01) and the gyro.
    twist_covariance_diagonal: [2.0e-3, 1.0e-4, 1.0e+6, 1.0e+6, 1.0e+6, 2.0e-1]

start_button:
  ros__parameters:
    pin: 16
    pull_up: true
    active_low: true
    poll_period_ms: 5
    debounce_ms: 30
